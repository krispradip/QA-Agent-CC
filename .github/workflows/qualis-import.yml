name: Qualis import regression
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  import-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check public/js/app.js
          node --check public/js/ui.js
          node --check public/js/history.js
          node --check public/js/parser.js
      - name: Import and re-evaluation regression
        run: node --test tests/import-flow.test.mjs
